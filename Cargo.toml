[package]
name = "temps_libre"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gestionnaire de collection de montres"

[dependencies]
eframe = "0.28"
egui = "0.28"
serde = { version = "1.0", features = ["derive"] }
